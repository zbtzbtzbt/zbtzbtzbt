<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title description">
  <title id="title">zbt — AI Infrastructure</title>
  <desc id="description">Large-model training, LLM and VLM. Distributed training, GPU systems, and multimodal efficiency. A dark blue banner with a cyan and violet compute topology.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#10172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60e4ed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60e4ed" stop-opacity=".7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="cyanHalo">
      <stop offset="0" stop-color="#25c9db" stop-opacity=".14"/>
      <stop offset="1" stop-color="#25c9db" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetHalo">
      <stop offset="0" stop-color="#9e6ef0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9e6ef0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#93b4dc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="bounds"><rect width="1280" height="340" rx="20"/></clipPath>
    <g id="gpu">
      <rect x="-44" y="-32" width="88" height="64" rx="10" fill="#111e30" stroke="#53c6dc" stroke-opacity=".58"/>
      <rect x="-24" y="-16" width="48" height="32" rx="4" fill="#122b3c" stroke="#67e8f9" stroke-opacity=".72"/>
      <path d="M-16-23V-32M0-23V-32M16-23V-32M-16 23V32M0 23V32M16 23V32M-32-10H-44M-32 10H-44M32-10H44M32 10H44" fill="none" stroke="#74c5d7" stroke-opacity=".7" stroke-width="1.5"/>
      <path d="M-15-7H-7V1H-15ZM-3-7H5V1H-3ZM9-7H17V1H9ZM-15 5H-7V10H-15ZM-3 5H5V10H-3ZM9 5H17V10H9Z" fill="#77dfef" fill-opacity=".7"/>
    </g>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="340" fill="url(#background)"/>
    <ellipse cx="1040" cy="85" rx="330" ry="230" fill="url(#cyanHalo)"/>
    <ellipse cx="1110" cy="330" rx="380" ry="270" fill="url(#violetHalo)"/>
    <rect x="720" width="560" height="340" fill="url(#grid)"/>
    <path d="M780 0V340" stroke="#51627d" stroke-opacity=".14"/>
    <path d="M69 48H115" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="65" y="127" font-size="76" font-weight="750" letter-spacing="-3.5" fill="#f4f8ff">zbt<tspan fill="#64e3ee">.</tspan></text>
      <text x="69" y="177" font-size="36" font-weight="600" letter-spacing="-.65" fill="#e4ecfa">AI Infrastructure</text>
      <text x="70" y="217" font-size="22" font-weight="400" fill="#9daec5">Large-model training · LLM / VLM</text>

      <g font-size="13" font-weight="600" letter-spacing="1.1">
        <rect x="69" y="260" width="224" height="34" rx="7" fill="#112233" stroke="#397285" stroke-opacity=".48"/>
        <text x="85" y="282" fill="#8ce6ed">DISTRIBUTED TRAINING</text>
        <rect x="305" y="260" width="143" height="34" rx="7" fill="#192037" stroke="#62648f" stroke-opacity=".46"/>
        <text x="321" y="282" fill="#c2b9f7">GPU SYSTEMS</text>
        <rect x="460" y="260" width="237" height="34" rx="7" fill="#131e30" stroke="#435b79" stroke-opacity=".46"/>
        <text x="476" y="282" fill="#a9bdd8">MULTIMODAL EFFICIENCY</text>
      </g>
    </g>

    <g transform="translate(1015 171)">
      <rect x="-205" y="-125" width="410" height="250" rx="18" fill="#0b1525" fill-opacity=".68" stroke="#7298c7" stroke-opacity=".17"/>
      <path d="M-137-71H-41L0-28L41-71H137M-137 71H-41L0 28L41 71H137M-137-39V39M137-39V39" fill="none" stroke="url(#link)" stroke-width="1.8"/>
      <path d="M-137-71H-41L0-28L41-71H137M-137 71H-41L0 28L41 71H137" fill="none" stroke="#63e7f3" stroke-width="3" stroke-opacity=".22" filter="url(#glow)"/>
      <path d="M-91-71H91M-91 71H91" fill="none" stroke="#748aab" stroke-opacity=".24" stroke-dasharray="3 6"/>
      <use href="#gpu" transform="translate(-137 -71)"/>
      <use href="#gpu" transform="translate(137 -71)"/>
      <use href="#gpu" transform="translate(-137 71)"/>
      <use href="#gpu" transform="translate(137 71)"/>

      <rect x="-29" y="-29" width="58" height="58" rx="13" transform="rotate(45)" fill="#19233c" stroke="url(#accent)" stroke-width="1.6"/>
      <circle r="10" fill="#6ce4ef" fill-opacity=".10" stroke="#88ddea" stroke-width="1.5"/>
      <circle r="3.5" fill="#a0ecf2"/>
      <circle cx="-75" cy="-71" r="2.5" fill="#5fdce9"/>
      <circle cx="75" cy="71" r="2.5" fill="#ad94fa"/>
      <circle cx="-137" cy="0" r="2.5" fill="#61e4ed"/>
      <circle cx="137" cy="0" r="2.5" fill="#a48def"/>

      <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="1.5" fill="#8298b6">
        <text x="-183" y="-107">COMPUTE FABRIC</text>
        <text x="0" y="71" text-anchor="middle" fill="#a7afd0">COMMUNICATION</text>
      </g>
      <path d="M180-109H189V-100M180 109H189V100M-189 100V109H-180" fill="none" stroke="#7f9bc2" stroke-opacity=".45"/>
    </g>
    <rect x=".5" y=".5" width="1279" height="339" rx="19.5" fill="none" stroke="#596986" stroke-opacity=".25"/>
  </g>
</svg>
